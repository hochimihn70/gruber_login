services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: authdb
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword --protocol=tcp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://authuser:authpassword@db:3306/authdb}
      # Server-Geheimnis: wird für HMAC-Signaturen und die Verschlüsselung des
      # TOTP-Secrets gebraucht. MUSS stabil bleiben, sonst sind vorhandene
      # TOTP-Secrets nach einem Neustart nicht mehr entschlüsselbar.
      APP_SECRET: ${APP_SECRET:-}
      # SMTP-Credentials kommen aus der .env (siehe .env.example).
      # Leere Werte = Dev-Modus: Codes werden dann direkt im Browser angezeigt.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Session-Cookie nur über HTTPS senden (Standard: true)
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Zeitliche Login-Beschränkung (optional)
      LOGIN_RESTRICTION_ENABLED: ${LOGIN_RESTRICTION_ENABLED:-false}
      LOGIN_ALLOWED_START_HOUR: ${LOGIN_ALLOWED_START_HOUR:-6}
      LOGIN_ALLOWED_END_HOUR: ${LOGIN_ALLOWED_END_HOUR:-22}
      # Rate-Limiting (Standard: an). X-Forwarded-For nur hinter einem Proxy auswerten.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    ports:
      - "5000:5000"
    restart: on-failure
    # Der Prozess läuft im Image bereits als Benutzer "app" (UID 10001).
    # Zusätzlich: keine zusätzlichen Kernel-Rechte, keine Privilegien-Eskalation.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Prüft, ob die App wirklich bereit ist (nicht nur, ob der Prozess läuft).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Opt-in: der Tunnel startet nur mit "--profile tunnel".
    # Grund: ohne TUNNEL_TOKEN (z. B. beim frischen Klon für die lokale Demo) läuft
    # cloudflared sonst in einer Endlosschleife und sieht kaputt aus.
    profiles: ["tunnel"]
    # Kein Endlos-Neustart: bei ungültigem Token gibt es 5 Versuche, dann stoppt der
    # Container sichtbar - die App läuft davon unbeeinflusst weiter.
    restart: on-failure:5
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - web

volumes:
  mysql_data:
